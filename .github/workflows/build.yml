name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Dateien ordnen
        working-directory: .github/workflows
        run: |
          mkdir -p app/src/main/java/com/example/routersms
          M=$(find . -name AndroidManifest.xml | head -n1)
          if [ -n "$M" ] && [ "$M" != "./app/src/main/AndroidManifest.xml" ]; then
            mv "$M" app/src/main/AndroidManifest.xml
          fi
          for f in MainActivity.kt PollService.kt; do
            P=$(find . -name "$f" | head -n1)
            D="./app/src/main/java/com/example/routersms/$f"
            if [ -n "$P" ] && [ "$P" != "$D" ]; then
              mv "$P" "$D"
            fi
          done
          echo "android.useAndroidX=true" > gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m" >> gradle.properties
          find . -type f | sort
      - name: Bauen
        working-directory: .github/workflows
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: router-sms-apk
          path: .github/workflows/app/build/outputs/apk/debug/app-debug.apk
